<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | DriveEase</title>

  <!-- favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- font(iconlar için)-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- css -->
  <link rel="stylesheet" href="assets/css/style.css">

  <script>
    var PAGE_NAME = "Login";
    document.addEventListener("DOMContentLoaded", function () {
      document.title = PAGE_NAME + " | DriveEase";
    });
  </script>
</head>

<body class="auth-body">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 <div class="container d-flex justify-content-center align-items-center min-vh-100">

  <div class="card shadow-lg p-4" style="max-width: 450px; width:100%; border-radius:20px;">

    <!-- Logo -->
    <div class="text-center mb-3">
      <a href="index.html" class="fs-2 fw-bold text-decoration-none text-dark">
        Drive<span class="text-primary">Ease</span>
      </a>
    </div>

    <!-- Başlık -->
    <div class="text-center mb-4">
      <h1 class="h3 fw-bold">Welcome back</h1>
      <p class="text-muted">Sign in to your account to continue</p>
    </div>

    <!-- Hata Mesajı -->
    <div id="err-box" class="alert alert-danger d-none" role="alert">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="err-msg">Invalid username or password.</span>
    </div>

    <!-- Form -->
    <form id="form-login" novalidate>

      <div class="mb-3">
        <label for="inp-user" class="form-label fw-semibold">
          <i class="fa-solid fa-user"></i> Username
        </label>

        <input
          type="text"
          class="form-control"
          id="inp-user"
          placeholder="Enter your username"
          autocomplete="username">

        <div class="text-danger small mt-1" id="err-user">
          Please enter your username.
        </div>
      </div>

      <div class="mb-3">
        <label for="inp-pass" class="form-label fw-semibold">
          <i class="fa-solid fa-lock"></i> Password
        </label>

        <input
          type="password"
          class="form-control"
          id="inp-pass"
          placeholder="Enter your password"
          autocomplete="current-password">

        <div class="text-danger small mt-1" id="err-pass">
          Please enter your password.
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2" id="btn-submit">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In
      </button>

    </form>

    <!-- Footer -->
    <p class="text-center mt-4 mb-2">
      Don't have an account?
      <a href="register.html" class="text-decoration-none fw-semibold">
        Create one
      </a>
    </p>

    <!-- Demo -->
    <div class="alert alert-info mt-3 mb-0">
      <i class="fa-solid fa-circle-info"></i>
      Demo:
      <strong>admin</strong> /
      <strong>1234</strong>
    </div>

  </div>

</div>



  <!-- auth.js-->
  <script src="assets/scripts/auth.js"></script>


  <script>
    // Zaten giriş yapılmışsa ana sayfaya yönlendir
    if (getCurrentUser()) {
      window.location.href = "index.html";
    }

    document.getElementById("form-login").addEventListener("submit", function (e) {
      e.preventDefault();

      var usernameInput = document.getElementById("inp-user");
      var passwordInput = document.getElementById("inp-pass");
      var username = usernameInput.value.trim();
      var password = passwordInput.value.trim();
      var valid = true;

      // Önceki hata mesajlarını temizle
      usernameInput.classList.remove("invalid");
      passwordInput.classList.remove("invalid");
      document.getElementById("err-box").classList.remove("show");

      // Kullanıcı adı doğrulama
      if (username === "") {
        usernameInput.classList.add("invalid");
        document.getElementById("err-user").textContent = "Please enter your username.";
        valid = false;
      }

      // Şifre doğrulama
      if (password === "") {
        passwordInput.classList.add("invalid");
        document.getElementById("err-pass").textContent = "Please enter your password.";
        valid = false;
      }

      if (!valid) return;

      // Kullanıcı bilgilerini kontrol et
      var user = loginUser(username, password);
      if (user) {
        setCurrentUser(user);
        window.location.href = "index.html";
      } else {
        document.getElementById("err-box").classList.add("show");
        document.getElementById("err-msg").textContent = "Invalid username or password. Please try again.";
      }
    });
  </script>

</body>

</html>
